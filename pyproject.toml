
[project]
name = "prodml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn",
    "fastapi[standard]",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
]

[project.scripts]
prodml-train = "prodml.train:main"
prodml-predict = "prodml.predict:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--cov=src/prodml --cov-fail-under=70"

[tool.coverage.run]
omit = [
    "src/prodml/train.py",
    "src/prodml/data.py",
    "src/prodml/registry.py",
]

[dependency-groups]
train = [
    "pandas",
    "pyarrow",
    "onnx>=1.22.0",
    "skl2onnx>=1.20.0",
    "onnxruntime>=1.24.3",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "httpx",
    "pre-commit",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
]