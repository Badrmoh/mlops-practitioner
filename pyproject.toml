[project]
name = "prodml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["scikit-learn","pandas","pyarrow","fastapi","uvicorn","pydantic","pydantic-settings"]

[project.optional-dependencies]
dev = ["pytest","pytest-cov","ruff","black","mypy","httpx","pre-commit"]

[project.scripts]
prodml-train = "prodml.train:main"
prodml-predict = "prodml.predict:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
]
